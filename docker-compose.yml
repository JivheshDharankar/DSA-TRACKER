version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dsa_tracker_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dsa_tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa_tracker_api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/dsa_tracker
      - JWT_SECRET=production_secret_change_me_to_at_least_32_random_bytes
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api/v1
    container_name: dsa_tracker_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
